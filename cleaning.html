<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nettoyage — S-Factory Premium</title>
  <link rel="stylesheet" href="staff.css" />
</head>
<body>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <a href="index.html" class="sidebar-logo">S-Factory <span>Propreté</span></a>
      <button class="sidebar-close" id="sidebarClose">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="sidebar-user">
      <div class="user-avatar" id="userAvatar">N</div>
      <div class="user-details">
        <div class="user-name" id="sidebarName">Agent</div>
        <div class="user-role">Personnel nettoyage</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <ul>
        <li><a href="#" class="nav-item active" data-section="tasks">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          Mes tâches
        </a></li>
        <li><a href="#" class="nav-item" data-section="shifts">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Mon planning
        </a></li>
      </ul>
    </nav>
    <div class="sidebar-bottom">
      <button class="logout-btn" id="logoutBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Déconnexion
      </button>
    </div>
  </aside>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <main class="main">
    <header class="topbar">
      <button class="menu-toggle" id="menuToggle"><span></span><span></span><span></span></button>
      <div class="topbar-title" id="topbarTitle">Mes tâches</div>
      <div class="topbar-right">
        <div class="topbar-user">
          <div class="topbar-avatar" id="topbarAvatar">N</div>
          <span id="topbarName">Agent</span>
        </div>
      </div>
    </header>

    <div class="page-content">

      <!-- ── TASKS ── -->
      <section class="section active" id="sec-tasks">
        <div class="page-header">
          <h1 class="page-title">Mes tâches</h1>
          <p class="page-sub">Tâches de nettoyage assignées</p>
        </div>
        <div class="card" id="tasksCard">
          <div class="empty-state"><p>Chargement…</p></div>
        </div>
      </section>

      <!-- ── SHIFTS ── -->
      <section class="section" id="sec-shifts">
        <div class="page-header">
          <h1 class="page-title">Mon planning</h1>
          <p class="page-sub">Vos shifts programmés</p>
        </div>
        <div class="card" id="shiftsCard">
          <div class="empty-state"><p>Chargement…</p></div>
        </div>
      </section>

    </div>
  </main>

  <script src="cleaning.js"></script>
</body>
</html>
